name: 'Allure-Katalon Bridge'
description: 'Zero-touch Allure reporting for Katalon Studio - no plugin, no OSGi packaging, no test script changes.'
author: 'Monty Bagati'
branding:
  icon: 'bar-chart-2'
  color: 'orange'

inputs:
  project-path:
    description: 'Path to the Katalon Studio project (the folder containing the .prj file)'
    required: false
    default: '.'
  force:
    description: 'Also overwrite a customized allure.properties/categories.json with the shipped default'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install/upgrade Allure-Katalon Bridge
      shell: bash
      run: |
        if [ "${{ inputs.force }}" = "true" ]; then
          npx allure-katalon-bridge install "${{ inputs.project-path }}" --force
        else
          npx allure-katalon-bridge install "${{ inputs.project-path }}"
        fi
