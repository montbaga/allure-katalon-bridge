# Allure-Katalon Bridge configuration
# ------------------------------------------------------------------
# Every key here can be overridden without touching this file by setting
# an environment variable named ALLURE_<KEY_IN_UPPER_SNAKE_CASE>, e.g.
#   allure.results.dir       -> ALLURE_RESULTS_DIR
#   allure.enabled           -> ALLURE_ENABLED
# This lets each CI environment (Jenkins, Azure Pipelines, local dev)
# point results wherever it needs to without forking this file. These
# variables also reach suites run with "Enable Parallel Execution".

# Master switch. Set to false to disable Allure reporting entirely
# (e.g. for a quick local debug run) without removing the listener.
allure.enabled=true

# Where allure-results (the raw JSON Allure reads) are written.
# Relative paths are resolved against the Katalon project root.
allure.results.dir=allure-results

# true (default): delete this folder's leftover *-result.json/
# *-container.json/*-attachment* files from an earlier, unrelated run
# before writing new ones, so each generated report reflects only the run
# it's named after. The earlier run's environment.properties and history/
# are cleared too - history is taken from the previous report with the same
# name instead. Nothing else in the folder is touched. Does NOT clear between the Test
# Suites of one Test Suite Collection run (they all share the same
# Reports/<timestamp> folder, which is how a "new run" is detected) -
# those are meant to combine into one report. Set to false if you run
# multiple *unrelated* suites in true parallel against this same folder -
# a suite starting mid-run could otherwise wipe another suite's
# still-in-progress results.
allure.clean.results.before.run=true

# Attach a screenshot automatically when a test case does NOT pass.
# Taken from the open WebUI browser, or the Mobile app session if no
# browser is open; silently skipped for API-only test cases.
allure.attach.screenshot.on.failure=true

# Attach a screenshot for every test case, pass or fail. Off by default
# because it bloats allure-results on large WebUI suites.
allure.attach.screenshot.always=false

# Attach the page's HTML (or a mobile app's XML view hierarchy) when a test
# case does NOT pass, next to the screenshot - shows what was actually on
# the page when an element couldn't be found.
allure.attach.page.source.on.failure=true

# Attach every API request a test case sends (method, URL, headers, body and
# the response), read from the .har files Katalon already writes. Auth
# headers, cookies and password/token/secret fields are always masked.
allure.attach.http=true

# Turns a bare id into a full link: AllureKeywords.issue('BUG-12') or a
# Katalon tag "allure.issue:BUG-12" becomes a link to the pattern with {}
# replaced by the id. Same for tmsLink('TC-34') / "allure.tms:TC-34".
#allure.link.issue.pattern=https://jira.example.com/browse/{}
#allure.link.tms.pattern=https://tms.example.com/testcase/{}

# true (default): when an Allure test plan is given, run only the test cases
# it lists - the others are skipped and left out of the report. This is how
# Allure TestOps "Rerun" works. With no plan given, everything runs as usual.
# false: ignore any test plan, always run everything.
allure.testplan.enabled=true

# Test plan file. Normally left unset - Allure TestOps passes it per rerun
# through the ALLURE_TESTPLAN_PATH environment variable.
#allure.testplan.path=

# Path (relative to project root, or absolute) to the categories.json
# template that classifies failures in the Allure "Categories" tab.
allure.categories.file=Include/config/allure/categories.json

# Automatically run "allure generate" at the end of every suite, so a
# finished HTML report is already sitting on disk with no extra step -
# just open it (e.g. via "View Allure Report"). Requires the Allure 2
# commandline (npm install -g allure-commandline - "npm install -g allure"
# is Allure 3, which isn't supported); if it's missing or the wrong
# version, an [Allure] message in the console says so and the suite
# result is unaffected.
# Generate-only - never auto-opens a browser or starts a server, so it's
# safe to leave on for CI too.
allure.auto.generate.report=true

# Absolute path to the 'allure' commandline executable, only needed if
# auto-detection doesn't find it (checked in this order: this setting,
# then a few common install locations, then - on macOS/Linux - the
# current user's own login shell PATH, then a bare "allure" on whatever
# PATH this process already inherited). Most likely to matter running the
# Katalon Studio IDE as a desktop app on macOS/Linux, since a GUI-launched
# app does not source the shell profile scripts (.zshrc, .bash_profile,
# etc) that tools like volta/nvm/sdkman/homebrew rely on to reach PATH -
# CI pipelines are unaffected, since they already run Katalon from inside
# a shell step that has the right PATH already.
# Example (macOS + volta): allure.commandline.path=/Users/you/.volta/bin/allure
#allure.commandline.path=

# Base folder the HTML report is written under. Each run gets its own
# "<Name>_<yyyyMMdd_HHmmss>" here (mirrors Katalon's own
# Reports/<timestamp>/<SuiteName> naming) so repeated runs don't overwrite
# each other. <Name> is a Test Suite Collection's name if you ran one
# (Katalon writes this early, before any sub-suite starts, under
# Reports/<timestamp>/.metadata/ - there's no simpler public API for this),
# otherwise the Test Suite's name, or a lone Test Case's own name if run
# directly without a saved suite. The report only generates once every
# suite in the current run has finished (not progressively as each one
# does), and a Test Suite Collection produces exactly one combined report,
# not one per Test Suite. Relative paths are resolved against the Katalon
# project root.
allure.report.dir=allure-report

# true (default): each run produces one self-contained ".html" file - all
# data embedded inline, so it opens correctly straight from a double-click
# (file://), no server needed. false: produces a "<Name>_<timestamp>/"
# folder instead (needs "View Allure Report"/"allure open" to view - a
# plain browser open of its index.html will fail). Only turn this off for
# very large suites, where one huge single HTML file gets slow to load.
allure.report.single.file=true

# true (default): automatically turn each test case's own Katalon
# execution log (every keyword/script line it already records, complete
# with pass/fail per line) into nested Allure steps - no test script
# changes needed. A failed step also gets the screenshot Katalon took at
# that moment, and manual AllureKeywords.step() calls are kept in place. This reads an already-written, already-closed log file
# per test case, so it can never affect the actual test outcome. Turn off
# for very large/slow suites if the extra per-test-case parsing overhead
# isn't worth it, or if you only want the manual AllureKeywords.step()
# calls you've explicitly added in your scripts.
allure.capture.steps=true
