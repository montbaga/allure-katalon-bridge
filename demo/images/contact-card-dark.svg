<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 228" width="1200" height="228" role="img" aria-label="Contact Monty Bagati — Built Allure-Katalon Bridge">
  <defs>
    <linearGradient id="cbg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1215"/>
      <stop offset="60%" stop-color="#111d22"/>
      <stop offset="100%" stop-color="#17272e"/>
    </linearGradient>
    <radialGradient id="cglow" cx="0.86" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#ff7b3b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff7b3b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ticket-clip">
      <rect x="4" y="4" width="1192" height="220" rx="20"/>
    </clipPath>
    <mask id="notch-mask">
      <rect width="1200" height="228" fill="#ffffff"/>
      <circle cx="816" cy="4" r="12" fill="#000000"/>
      <circle cx="816" cy="224" r="12" fill="#000000"/>
    </mask>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
      @keyframes pingDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.8); }
      }
      @keyframes pingHalo {
        0% { opacity: 0.75; transform: scale(1); }
        100% { opacity: 0; transform: scale(2.5); }
      }
      @keyframes shimmerLine {
        0% { transform: translateX(-220px); opacity: 0; }
        25% { opacity: 0.85; }
        75% { opacity: 0.85; }
        100% { transform: translateX(340px); opacity: 0; }
      }
      .dot { animation: pingDot 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .halo { animation: pingHalo 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .shimmer { animation: shimmerLine 3.8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .dot, .halo, .shimmer { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#ticket-clip)" mask="url(#notch-mask)">
    <rect x="4" y="4" width="1192" height="220" rx="20" fill="url(#cbg-dark)"/>
    <rect x="4" y="4" width="1192" height="220" rx="20" fill="url(#cglow)"/>

    <line x1="816" y1="22" x2="816" y2="206" stroke="#ece6da" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="5 6"/>

    <!-- LEFT SECTION -->
    <rect x="44" y="34" width="322" height="28" rx="14" fill="#17272e" stroke="#ff7b3b" stroke-opacity="0.4"/>
    <circle cx="62" cy="48" r="4.5" fill="none" stroke="#3dd98f" stroke-width="1.4" class="halo"/>
    <circle cx="62" cy="48" r="4.5" fill="#3dd98f" class="dot"/>
    <text x="76" y="52" class="mono" font-size="11" font-weight="700" letter-spacing="1.2" fill="#ffc857">DIRECT LINE · SAY HELLO ONCE</text>

    <text x="44" y="102" class="sans" font-size="34" font-weight="700" letter-spacing="-0.8" fill="#ece6da">Scaling Katalon in CI/CD? Let's talk.</text>
    <text x="44" y="138" class="serif" font-size="23" fill="#ff7b3b">ci/cd consulting · custom pipelines · testops setup · feedback</text>

    <text x="44" y="176" class="sans" font-size="15" fill="#c7c2b6">Wiring Allure across Azure, GitHub, GitLab, or TestOps for your QA team,</text>
    <text x="44" y="197" class="sans" font-size="15" fill="#c7c2b6">or want a feature tailored? Reach out once — I reply personally.</text>

    <!-- RIGHT STUB -->
    <g transform="translate(848, 28)">
      <rect width="316" height="172" rx="14" fill="#091012" stroke="#ff7b3b" stroke-opacity="0.34" stroke-width="1.2"/>
      <clipPath id="stub-top"><rect x="1" y="1" width="314" height="38" rx="13"/></clipPath>
      <g clip-path="url(#stub-top)">
        <rect width="316" height="38" fill="#162328"/>
        <rect x="0" y="36" width="140" height="2" fill="#ff7b3b" class="shimmer"/>
      </g>
      <text x="18" y="25" class="mono" font-size="11" font-weight="700" letter-spacing="1.1" fill="#ffc857">SUPPORT DESK · MONTY BAGATI</text>

      <rect x="16" y="52" width="284" height="32" rx="7" fill="#131f24" stroke="#ece6da" stroke-opacity="0.14"/>
      <text x="28" y="72" class="mono" font-size="12" fill="#3dd98f">EMAIL</text>
      <text x="82" y="72" class="sans" font-size="13" font-weight="600" fill="#ece6da">bagati.monty@gmail.com</text>

      <rect x="16" y="92" width="284" height="32" rx="7" fill="#131f24" stroke="#ece6da" stroke-opacity="0.14"/>
      <text x="28" y="112" class="mono" font-size="12" fill="#ffc857">LINKEDIN</text>
      <text x="104" y="112" class="sans" font-size="13" font-weight="600" fill="#ece6da">in/monty-bagati-90454626</text>

      <rect x="16" y="132" width="284" height="32" rx="7" fill="#131f24" stroke="#ece6da" stroke-opacity="0.14"/>
      <text x="28" y="152" class="mono" font-size="12" fill="#ff7b3b">GITHUB</text>
      <text x="90" y="152" class="sans" font-size="13" font-weight="600" fill="#ece6da">@montbaga · clickable links ↓</text>
    </g>

    <rect x="4.75" y="4.75" width="1190.5" height="218.5" rx="19.25" fill="none" stroke="#ece6da" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>
</svg>
